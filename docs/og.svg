<svg xmlns="http://www.w3.org/2000/svg" width="820" height="376" viewBox="0 0 820 376">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e6a63"/>
    </marker>
  </defs>

  <rect width="820" height="376" rx="14" fill="#0d0c0b"/>

  <text x="60" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3" fill="#6e6a63">HUB-AND-SPOKE, NOT CIRCUIT</text>
  <text x="60" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#4a4742">one base, spokes radiating outward — the novelty peak lands days 5&#8211;8, not day 1</text>

  <!-- panel divider -->
  <line x1="460" y1="92" x2="460" y2="268" stroke="#2a2823" stroke-width="1"/>

  <!-- left panel: hub and spoke -->
  <line x1="160" y1="167" x2="238" y2="116" stroke="#4a4742" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="160" y1="193" x2="238" y2="244" stroke="#4a4742" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="164" y1="180" x2="355" y2="180" stroke="#ffa657" stroke-width="2" stroke-dasharray="2 5"/>

  <circle cx="140" cy="180" r="24" fill="#1a1815" stroke="#6e6a63" stroke-width="2.5"/>
  <circle cx="250" cy="108" r="14" fill="#1a1815" stroke="#6e6a63" stroke-width="2"/>
  <circle cx="250" cy="252" r="14" fill="#1a1815" stroke="#6e6a63" stroke-width="2"/>
  <circle cx="375" cy="180" r="20" fill="none" stroke="#ffa657" stroke-width="2.5" stroke-dasharray="4 4"/>

  <text x="140" y="224" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#6e6a63">same bed</text>
  <text x="140" y="238" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#6e6a63">every night</text>

  <text x="375" y="220" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#ffa657">the peak spoke</text>
  <text x="375" y="236" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#6e6a63">one signature day trip,</text>
  <text x="375" y="250" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#6e6a63">days 5&#8211;8 &#8212; not day 1</text>

  <!-- right panel: the 8-day novelty curve -->
  <line x1="470" y1="250" x2="750" y2="250" stroke="#2a2823" stroke-width="1"/>
  <line x1="584" y1="131" x2="584" y2="250" stroke="#2a2823" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="662" y1="131" x2="662" y2="250" stroke="#2a2823" stroke-width="1" stroke-dasharray="2 4"/>

  <polyline points="480,229 506,208 532,187 558,166 584,131 610,117 636,117 662,131 688,180 714,208"
            fill="none" stroke="#6e6a63" stroke-width="2"/>
  <polyline points="584,131 610,117 636,117 662,131" fill="none" stroke="#ffa657" stroke-width="2.5"/>

  <text x="623" y="106" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1" fill="#ffa657">PEAK</text>
  <text x="480" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#6e6a63">day 1</text>
  <text x="623" y="266" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#ffa657">days 5&#8211;8</text>
  <text x="714" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#6e6a63">10+</text>

  <line x1="60" y1="300" x2="760" y2="300" stroke="#2a2823" stroke-width="1"/>
  <text x="60" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="700" fill="#ffa657">travel-agent</text>
  <text x="60" y="356" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a8a49c">Trip planning as an engineering discipline &#8212; architecture before itinerary.</text>
</svg>
